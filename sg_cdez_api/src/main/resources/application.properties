spring.application.name=sg_cdez_api

# Puerto asignado por la plataforma de deployment.
# Localmente continúa utilizando el puerto 8080.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Aiven Free permite un máximo reducido de conexiones.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

#jwt token secret con expiración de 30 mins (en milisegundos)
jwt.secret=${SECRET_KEY}
jwt.expirationMs=${JWT_EXPIRATION_MS:900000}

# Refresh token: 7 días
refresh.expirationMs=${REFRESH_EXPIRATION_MS:604800000}

# SMTP Config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Paginación
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.sort.sort-parameter=sort

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Cookies de autenticación.
# En producción: COOKIE_SECURE=true y COOKIE_SAME_SITE=None.
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}