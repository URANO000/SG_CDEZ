spring.application.name=sg_cdez_api

# Port assigned by the deployment platform.
# Locally it continues using port 8080.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Aiven Free has a reduced connection limit.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# JWT access token expiration.
jwt.secret=${SECRET_KEY}
jwt.expirationMs=${JWT_EXPIRATION_MS:900000}

# Refresh token expiration: 7 days.
refresh.expirationMs=${REFRESH_EXPIRATION_MS:604800000}

# Brevo Email API.
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=${BREVO_SENDER_NAME:CDEZ}

# Pagination.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.sort.sort-parameter=sort

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Authentication cookies.
# Production uses COOKIE_SECURE=true and COOKIE_SAME_SITE=None.
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}